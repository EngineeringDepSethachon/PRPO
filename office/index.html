<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lazy dough ·</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121f;--panel:#221d3a;--panel2:#2c2650;--gold:#ffd84d;--tx:#f2eefc;--mut:#9b93b8;--ok:#5be37d;--bad:#ff5a6e;--blue:#6ea8ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Sarabun','Noto Sans Thai',system-ui,sans-serif}
.pf,.btn,#logo{font-family:'Press Start 2P','Sarabun',monospace}
.mut{color:var(--mut)}
.grow{flex:1}
.px{background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 #ffffff22,inset -3px -3px 0 #00000066}
#app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;height:100vh;padding:10px}
#main{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
#logo{font-size:13px;color:var(--gold)}
.led{width:12px;height:12px;border:2px solid #000;background:#555}
.led.run{background:var(--ok);animation:blink .8s steps(2) infinite}
.led.off{background:var(--bad)}
@keyframes blink{50%{opacity:.25}}
.btn{font-size:10px;line-height:1.2;color:#fff;background:#3a3470;border:3px solid #000;padding:9px 11px;cursor:pointer;box-shadow:inset 3px 3px 0 #ffffff33,inset -3px -3px 0 #00000055}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px)}
.btn.ok{background:#1f8f45}.btn.bad{background:#b3283c}.btn.gold{background:#b8890f;color:#000}
.badge{display:inline-block;min-width:18px;padding:1px 5px;background:var(--bad);color:#fff;border:2px solid #000;text-align:center}
.badge:empty,.badge[data-n="0"]{display:none}
#stageWrap{padding:8px}
#stage{position:relative;container-type:inline-size;width:100%;max-width:1100px;margin:0 auto;border:3px solid #000;background:#000}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border:.5cqw solid #000;padding:.3cqw .9cqw;font-size:1.9cqw;line-height:1.25;max-width:26cqw;text-align:center;display:none;z-index:3;box-shadow:.4cqw .4cqw 0 #0006}
.bub:after{content:'';position:absolute;left:50%;top:100%;margin-left:-.7cqw;border:.7cqw solid transparent;border-top-color:#000}
.tag{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.tag b{display:block;font-family:'Sarabun',sans-serif;font-weight:700;font-size:2.1cqw;color:#fff;text-shadow:.2cqw .2cqw 0 #000,-.1cqw -.1cqw 0 #000}
.tag i{display:inline-block;font-style:normal;font-family:'Press Start 2P',monospace;font-size:.75cqw;line-height:1;padding:.3cqw .5cqw;margin-top:.3cqw;border:.2cqw solid #000;color:#000;box-shadow:.15cqw .15cqw 0 #0006}
.zone{position:absolute;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:1cqw;color:#ffffff66;white-space:nowrap}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{padding:8px 10px;min-height:64px}
.card b{font-family:'Press Start 2P','Sarabun',monospace;font-size:10px}
.card i{font-style:normal;font-family:'Press Start 2P',monospace;font-size:8px;padding:2px 4px;border:2px solid #000;color:#000;margin-left:6px}
.card div{margin-top:5px;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side{display:flex;flex-direction:column;min-height:0;padding:0}
.tabs{display:flex}
.tab{flex:1;font:inherit;font-weight:600;color:var(--mut);background:#181430;border:0;border-bottom:3px solid #000;padding:11px 6px;cursor:pointer}
.tab.on{background:var(--panel);color:var(--gold)}
.pane{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:92%;padding:7px 10px;border:3px solid #000;white-space:pre-wrap;word-break:break-word}
.m.user{align-self:flex-end;background:#2f4f9a}
.m.fable{align-self:flex-start;background:var(--panel2)}
.m.system{align-self:center;background:transparent;border:0;color:var(--mut);font-size:12px;text-align:center}
.m code{background:#0006;padding:0 4px}
#typing{align-self:flex-start;color:var(--gold);font-family:'Press Start 2P',monospace;font-size:9px}
#typing:after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#form{display:flex;gap:6px;padding:8px;border-top:3px solid #000;background:#181430}
#inp{flex:1;resize:none;font:inherit;color:var(--tx);background:#0e0c1c;border:3px solid #000;padding:6px 8px;outline:0}
.n{padding:8px 10px;border:3px solid #000;background:var(--panel2);cursor:pointer}
.n.pend{background:#5a4510;border-color:var(--gold)}
.n small{display:block;color:var(--mut)}
.n .st{font-family:'Press Start 2P',monospace;font-size:8px}
#toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{width:320px;padding:10px 12px;background:#5a4510;border:3px solid var(--gold);box-shadow:4px 4px 0 #000;cursor:pointer;animation:pop .25s steps(4)}
.toast b{display:block;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);margin-bottom:6px}
@keyframes pop{from{transform:translateY(-16px);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
#mBox{width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px;padding:16px}
#mBox h2{margin:0;font-size:16px;color:var(--gold)}
#mBody{white-space:pre-wrap;overflow:auto;max-height:46vh;background:#0e0c1c;border:3px solid #000;padding:10px;word-break:break-word}
#mNote{width:100%;resize:none;font:inherit;color:var(--tx);background:#0e0c1c;border:3px solid #000;padding:6px 8px;outline:0}
#mActs{display:flex;gap:8px;flex-wrap:wrap}
#mRes{color:var(--ok)}
.tab{padding:11px 3px;font-size:13px}
#badge3{font-size:10px}
.bd-up{color:var(--mut);font-size:12px}
.bd-box{padding:8px 10px;background:var(--panel2);border:3px solid #000}
.bd-box h3{margin:0 0 6px;font-size:14px;color:var(--gold)}
.bd-box ul{margin:0;padding-left:18px}
.bd-box li{margin:2px 0;word-break:break-word}
.bd-box .empty{color:var(--mut)}
.bd-ms{margin:6px 0;border:2px solid #000;background:#0e0c1c;padding:5px 7px}
.bd-ms summary{cursor:pointer;word-break:break-word}
.bd-bar{height:12px;border:2px solid #000;background:#000;margin:5px 0 2px}
.bd-bar i{display:block;height:100%;background:var(--ok);width:0}
.bd-pct{color:var(--mut);font-size:12px}
.bd-it{list-style:none;padding-left:4px!important}
.bd-it.done{color:var(--mut)}
#deptTabs{display:flex;flex-wrap:nowrap;gap:6px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;flex:none}
.dtab{flex:none;display:flex;align-items:center;gap:7px;font-family:'Press Start 2P','Sarabun',monospace;font-size:9px;line-height:1.2;color:var(--mut);background:#181430;border:3px solid #000;padding:8px 10px;cursor:pointer;white-space:nowrap;box-shadow:inset 3px 3px 0 #ffffff22,inset -3px -3px 0 #00000055}
.dtab:hover{filter:brightness(1.15)}
.dtab.on{background:#3a3470;color:var(--gold)}
.dtab.exec{color:#ffd84d;border-color:#8a6a00;background:#2a2008}
.dtab.exec.on{background:#5a4510;color:#fff1b0}
.dtab .led{width:10px;height:10px}
.dtab .badge{font-size:9px;min-width:16px;padding:1px 4px}
.badge.gold{background:#d9a21b;color:#000}
.m.consult{align-self:flex-start;background:#3d3314;border-color:#8a6a00}
.m.memo,.m.memo_out{align-self:flex-start;background:#12304f;border-color:#2f7fc4}
.m.memo_out{opacity:.9}
.m.memo .ch,.m.memo_out .ch{display:block;font-family:'Press Start 2P','Sarabun',monospace;font-size:9px;color:#7cc4ff;margin-bottom:5px}
.m.consult .ch{display:block;font-family:'Press Start 2P','Sarabun',monospace;font-size:9px;color:var(--gold);margin-bottom:5px}
.cs-sec{display:flex;flex-direction:column;gap:6px}
.cs-sec h3{margin:6px 0 0;font-size:13px;color:var(--gold)}
.n.cons{background:#3d3314;border-color:#8a6a00}.n.cons.pend{background:#5a4510;border-color:var(--gold)}
.n.cons .cb{margin-top:4px;white-space:pre-wrap;word-break:break-word;color:var(--tx)}
.n.cons .cr{margin-top:4px;color:var(--ok);white-space:pre-wrap;word-break:break-word}
.ovd{position:absolute;inset:0;pointer-events:none}
.cardsd{display:contents}
.emptyTag{position:absolute;left:62%;top:64%;transform:translate(-50%,-50%);font-family:'Press Start 2P','Sarabun',monospace;font-size:1.6cqw;color:#fff;background:#000b;border:.3cqw solid #000;padding:.8cqw 1.2cqw;white-space:nowrap;z-index:2}
@media(max-width:900px){#app{grid-template-columns:1fr;height:auto}#side{height:70vh}}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <header class="px">
      <span id="logo">★ LAZY DOUGH</span><span id="logoSub" class="mut" style="font-size:8px;font-family:'Press Start 2P',monospace;margin-left:8px"></span>
      <span class="led off" id="led"></span><span id="runtxt" class="mut">ขาดการเชื่อมต่อ</span>
      <span class="grow"></span>
      <button class="btn" id="btnDesk" hidden>🔔 เปิดแจ้งเตือนเดสก์ท็อป</button>
      <button class="btn" id="btnNotif">📥 <span class="badge" id="badge" data-n="0"></span></button>
      <button class="btn bad" id="btnStop">■ หยุด</button>
    </header>
    <nav class="px" id="deptTabs" aria-label="แผนก"></nav>
    <section class="px" id="stageWrap"><div id="stage"><canvas id="cv" width="400" height="230"></canvas><div id="ov"></div></div></section>
    <section id="cards"></section>
  </div>
  <aside id="side" class="px">
    <div class="tabs"><button class="tab on" data-t="chat" id="tabChatL">💬 แชท</button><button class="tab" data-t="inbox"><span id="tabInboxL">📥 รอตัดสินใจ</span> <span class="badge" id="badge2" data-n="0"></span></button><button class="tab" data-t="board">📋 ไวท์บอร์ด <span class="badge" id="badge3" data-n="0"></span></button></div>
    <div id="chatWho" class="mut" style="font-size:11px;padding:4px 8px"></div>
    <div id="chat" class="pane"><div class="m system" id="hello"></div></div>
    <div id="inbox" class="pane" hidden></div>
    <div id="board" class="pane" hidden></div>
    <form id="form"><textarea id="inp" rows="2" placeholder=""></textarea><button class="btn ok" id="send" type="submit">ส่ง</button></form>
  </aside>
</div>
<div id="toasts"></div>
<div id="modal" hidden><div id="mBox" class="px">
  <div class="pf" id="mHead" style="font-size:10px;color:var(--mut)"></div>
  <h2 id="mTitle"></h2>
  <div id="mBody"></div>
  <textarea id="mNote" rows="2" placeholder=""></textarea>
  <div id="mActs"></div>
  <div id="mRes" hidden></div>
  <button class="btn" id="mClose">ปิด</button>
</div></div>

<script>
(()=>{
'use strict';
const TOKEN='__TOKEN__';
const W=400,H=230,CH=21,LANE=108;
const $=s=>document.querySelector(s);
const cv=$('#cv'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const O='#1a1423';
const MODELC={fable:'#ffd84d',opus:'#b07cff',sonnet:'#6ea8ff',haiku:'#5be37d'};
const nowS=()=>performance.now()/1000;
const rand=(a,b)=>a+Math.random()*(b-a);
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};

/* ============ ตัวละคร (สไตล์เดียวกับรูปอ้างอิง) ============ */
const PRESETS=[
 {hair:'#2b2330',jacket:'#2f2f3d',tie:'#3b5bdb',skin:'#f6c8a0',style:'short'},
 {hair:'#8a4b3a',jacket:'#6b6670',tie:'#c0392b',skin:'#f6c8a0',style:'short'},
 {hair:'#b0604a',jacket:'#3a3560',tie:'#a64dff',skin:'#f6c8a0',style:'ponytail'},
 {hair:'#2b2330',jacket:'#2f2f3d',tie:'#3b5bdb',skin:'#f6c8a0',style:'bun'},
 {hair:'#3a2f5c',jacket:'#7a7580',tie:'#eeeeee',skin:'#f6c8a0',style:'short'},
 {hair:'#7a3b4a',jacket:'#7a7580',tie:'#c0392b',skin:'#f6c8a0',style:'long'},
 {hair:'#4a3a8c',jacket:'#2f2f3d',tie:'#eeeeee',skin:'#f6c8a0',style:'long'},
 {hair:'#6b3a2a',jacket:'#9a8f80',tie:'#2e8b57',skin:'#f1bf94',style:'short'},
 {hair:'#6b4226',jacket:'#8a6a4a',tie:'#e8d5a8',skin:'#f1bf94',style:'bun'},
 {hair:'#16131c',jacket:'#14121a',tie:'#2ecc71',skin:'#f6c8a0',style:'short'},   // 9 neo: ผมดำสั้น แจ็กเก็ตดำ เน็คไทเขียว
 {hair:'#5a3d2b',jacket:'#4a5a6e',tie:'#e67e22',skin:'#f1bf94',style:'short'},    // 10 lead: หัวหน้าทั่วไป
 {hair:'#9b4a2f',jacket:'#1f2a44',tie:'#cfd8ea',skin:'#f6c8a0',style:'long'},      // 11 celine: ผมยาวน้ำตาลแดง สูท
 {hair:'#1d1a24',jacket:'#3d4f5c',tie:'#f1c40f',skin:'#f1bf94',style:'short'},    // 12 keith
 {hair:'#8a8a94',jacket:'#5c4a3a',tie:'#7a2e2e',skin:'#f6c8a0',style:'short'},    // 13 frank
 {hair:'#2a6b5a',jacket:'#3a5a52',tie:'#eeeeee',skin:'#f6c8a0',style:'ponytail'}, // 14 mint
 {hair:'#c0688a',jacket:'#5a3a5c',tie:'#f5b7d0',skin:'#f6c8a0',style:'bun'},      // 15 ploy
 {hair:'#3a2a1a',jacket:'#8a5a3a',tie:'#2e8b57',skin:'#f1bf94',style:'ponytail'}, // 16 bam
 {hair:'#101018',jacket:'#2c3a2c',tie:'#e67e22',skin:'#f1bf94',style:'short'},     // 17 tong
 {hair:'#5b3aa0',jacket:'#6a7a9a',tie:'#6ee0d8',skin:'#f6c8a0',style:'long'}      // 18 fah
];
const KNOWN={fable:0,somchai:1,malee:2,nong:3,kla:4,prae:5,kafae:8,neo:9,lead:10,celine:11,keith:12,frank:13,mint:14,ploy:15,bam:16,tong:17,fah:18};
let used=new Set();
function presetFor(name){
  const k=name.split('-')[0].toLowerCase();
  if(k in KNOWN&&!used.has(KNOWN[k])){used.add(KNOWN[k]);return PRESETS[KNOWN[k]]}
  for(let i=0;i<PRESETS.length;i++)if(!used.has(i)){used.add(i);return PRESETS[i]}
  return PRESETS[0];
}
const modelKind=m=>['fable','opus','sonnet','haiku'].find(k=>String(m||'').toLowerCase().includes(k))||'sonnet';

/* ============ ตำแหน่งในออฟฟิศ ============ */
const T=(x,y)=>({lx:x,inn:[{x,y}]});
function mgrLabel(s){
  s=s||cur||bound;
  const c=s&&s.chars&&s.chars[0];
  const n=c?c.label:(s&&s.mgrName)||'Fable';
  const t=String(n);return t.charAt(0).toUpperCase()+t.slice(1);
}
function mgrRole(s){
  s=s||cur||bound;if(!s)return '';
  return s.kind==='exec'?(s.theme==='silver'?'ผู้บริหารฝ่ายธุรกิจ':'ผู้บริหารฝ่ายเทคนิค'):'หัวหน้าทีม';
}
function pendingMgr(){ // หัวหน้าห้องที่รอคุณ: ห้องปัจจุบันก่อน
  if(cur&&cur.pending.size)return mgrLabel(cur);
  for(const s of STATE.values())if(s.pending.size)return mgrLabel(s);
  return mgrLabel(cur);
}
function refreshMgrUI(){
  if(!cur)return;
  const n=mgrLabel(cur);
  $('#btnStop').textContent='■ หยุด '+n;
  $('#tabChatL').textContent='💬 แชทกับ '+n;
  $('#inp').placeholder='พิมพ์คุยกับ '+n+'… (Enter = ส่ง, Shift+Enter = ขึ้นบรรทัดใหม่)';
  $('#mNote').placeholder='หมายเหตุถึง '+n+' (ไม่บังคับ)';
  $('#chatWho').textContent='คุณกำลังคุยกับ '+n+' — '+mgrRole(cur)+' ('+cur.name+')';
  const h=$('#hello');if(h)h.textContent='พิมพ์สั่งงาน '+n+' ได้เลย — '+n+' จะเริ่มทำงานตอนส่งข้อความแรก';
}
const isExec=()=>!!bound&&bound.kind==='exec';   // ห้องผู้บริหาร (ฉากต่างจากห้องทีม)
/* จุดยืน "หน้าโต๊ะ Fable" 3 จุด (n=0,1,2) สำหรับหัวหน้าที่มาขออนุมัติ — E9b ใช้กับ char ในห้อง executive */
const EXEC_STAND=n=>T(166+(((n%3)+3)%3)*34,110);
const meetBoss=()=>isExec()?EXEC_STAND(1):MEET_BOSS;
function slotFor(i){
  if(i===0&&isExec())return{exec:true,seat:{x:191,y:70},deskX:152,deskTop:82,deskW:96,tagY:89,out:[{x:262,y:70},{x:262,y:LANE}],inn:[{x:262,y:70},{x:191,y:70}],lx:262};
  if(i===0)return{seat:{x:30,y:62},deskX:13,deskTop:74,deskW:52,out:[{x:72,y:62},{x:72,y:LANE}],inn:[{x:72,y:62},{x:30,y:62}],lx:72};
  const dx=8+(i-1)*56;
  return{seat:{x:dx+17,y:146},deskX:dx,deskTop:158,deskW:50,out:[{x:dx+17,y:LANE}],inn:[{x:dx+17,y:146}],lx:dx+17};
}
const MEET_BOSS=T(196,62),MEET_PLAN=T(196,98);
const WB={x:83,y:4,w:72,h:32};                 // ไวท์บอร์ดบนผนัง (x 83-155, y 4-36)
const WB_PASTE=T(92,48),WB_WRITE=T(124,48); // จุดยืนหน้าไวท์บอร์ด
const VISIT=n=>T(78+(n%3)*17,66+(n%2)*9);
const RESTS=[
 {x:306,y:70,pose:'rest'},{x:330,y:70,pose:'rest'},
 {x:352,y:88,pose:'coffee'},{x:372,y:96,pose:'coffee'},
 {x:300,y:114,pose:'chill'},{x:322,y:114,pose:'chill'},{x:344,y:114,pose:'chill'}
];
const REST_AFTER=18;           // วินาทีที่ว่างก่อนไปพัก

/* ============ สถานะ ============ */
/* state ต่อแผนก: STATE.get(id) เก็บของทุกแผนก ; ตัวแปรด้านล่างคือ "สำเนาใช้งาน" ของแผนกที่ bind อยู่
   (cur = แผนกที่เปิดดู, bound = แผนกที่ตัวแปรชี้อยู่ตอนนี้ ; event ของแผนกอื่นใช้ inDept() สลับชั่วคราว) */
const STATE=new Map();let cur=null,bound=null;
let chars=[],byName={},asks=new Map(),pending=new Set();
let fable=null,running=false,rosterKey='',visitN=0,turnDelegated=false;
let boardShown=null,boardData=null,wbDirty=false,wbQueuedAt=0,wbWait=0;
let ov=null,cardsEl=null;
const ovRoot=$('#ov'),cardsRoot=$('#cards');
const LS_DEPT='office.dept';
function newState(id){
  const o=document.createElement('div');o.className='ovd';o.hidden=true;ovRoot.appendChild(o);
  const cd=document.createElement('div');cd.className='cardsd';cd.hidden=true;cardsRoot.appendChild(cd);
  return{id,name:id,empty:false,kind:'team',approver:null,theme:'gold',chat:[],boardNew:false,
    chars:[],byName:{},used:new Set(),asks:new Map(),pending:new Set(),ov:o,cardsEl:cd,
    fable:null,running:false,rosterKey:'',visitN:0,turnDelegated:false,boardShown:null,boardData:null,wbDirty:false,wbQueuedAt:0,wbWait:0};
}
function save(s){
  s.fable=fable;s.running=running;s.rosterKey=rosterKey;s.visitN=visitN;s.turnDelegated=turnDelegated;
  s.boardShown=boardShown;s.boardData=boardData;s.wbDirty=wbDirty;s.wbQueuedAt=wbQueuedAt;s.wbWait=wbWait;
}
function load(s){
  chars=s.chars;byName=s.byName;used=s.used;asks=s.asks;pending=s.pending;ov=s.ov;cardsEl=s.cardsEl;
  fable=s.fable;running=s.running;rosterKey=s.rosterKey;visitN=s.visitN;turnDelegated=s.turnDelegated;
  boardShown=s.boardShown;boardData=s.boardData;wbDirty=s.wbDirty;wbQueuedAt=s.wbQueuedAt;wbWait=s.wbWait;
}
function inDept(s,fn){
  if(s===bound){fn();return}
  if(bound)save(bound);
  load(s);bound=s;
  try{fn()}finally{save(s);bound=cur;if(cur)load(cur)}
}

/* ============ ตัวขยับ (queue ของขั้นตอน) ============ */
const atSeat=c=>Math.hypot(c.x-c.slot.seat.x,c.y-c.slot.seat.y)<1.5;
const seatT=c=>({lx:c.slot.lx,inn:c.slot.inn});
function route(c,tg){
  const pts=[];let cx=c.x,cy=c.y;
  if(atSeat(c)&&!(tg.inn.length&&Math.hypot(tg.inn[tg.inn.length-1].x-cx,tg.inn[tg.inn.length-1].y-cy)<1.5)){
    for(const p of c.slot.out)pts.push(p);
    const l=pts[pts.length-1];cx=l.x;cy=l.y;
  }
  const last=tg.inn[tg.inn.length-1];
  if(Math.hypot(last.x-cx,last.y-cy)<1.5&&!pts.length)return[];
  if(Math.abs(cy-LANE)>1){pts.push({x:cx,y:LANE});cy=LANE}
  if(Math.abs(cx-tg.lx)>1)pts.push({x:tg.lx,y:LANE});
  for(const p of tg.inn)pts.push(p);
  return pts;
}
function setBub(c,text,ms){c.bub=text?{text,until:ms===undefined||!isFinite(ms)?Infinity:nowS()+ms/1000}:null}
function startStep(c,s){
  c.cur=s;
  if(s.fn){c.cur=null;s.fn(c);return}
  if(s.carry!==undefined)c.carry=s.carry;
  setBub(c,s.bubble,s.ms);
  if(s.to){
    if(s.pose)c.q.unshift({pose:s.pose,ms:s.ms,bubble:s.bubble,carry:s.carry}); // เดินไปถึงแล้วค่อยทำท่า
    c.path=route(c,s.to);c.pose='walk';if(!c.path.length)c.cur=null;return
  }
  c.pose=s.pose||'stand';c.wait=s.ms===undefined?1:s.ms/1000;
}
function interrupt(c){c.q=[];c.cur=null;c.path=[];c.bub=null;freeRest(c)}
function freeRest(c){if(c.rest){c.rest.taken=null;c.rest=null}}
function seatPose(c){
  const n=nowS();
  if(c.cheer>n)return'cheer';
  if(c.mode==='working')return(c.icon==='🛡'||(c.icon==='🧪'&&Math.floor(c.t/3)%2===0))?'review':'work';
  if(c.reviewUntil>n)return'review';
  if(c.mgr&&running)return(n-c.lastTool<4)?'work':'think';
  return'sit';
}
function idleBehavior(c){
  if(!atSeat(c)){c.q.push({to:seatT(c),carry:null});return}
  c.pose=seatPose(c);
  if(!c.mgr&&c.mode==='idle'&&nowS()-c.last>REST_AFTER&&c.cheer<=nowS()){
    const r=RESTS.find(s=>!s.taken);
    if(r){r.taken=c;c.rest=r;c.q.push({to:T(r.x,r.y)},{pose:r.pose,ms:Infinity})}
  }
}
function update(c,dt){
  if(c.away)return;   // หัวหน้าอยู่ห้องผู้บริหาร (ซ่อน ไม่ขยับ)
  c.t+=dt;
  if(c.cur){
    if(c.cur.to){
      if(!c.path.length)c.cur=null;
      else{
        const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy),sp=64*dt;
        if(d<=sp){c.x=p.x;c.y=p.y;c.path.shift()}else{c.x+=dx/d*sp;c.y+=dy/d*sp}
      }
    }else{c.wait-=dt;if(c.wait<=0)c.cur=null}
  }
  while(!c.cur&&c.q.length)startStep(c,c.q.shift());
  if(!c.cur&&!c.q.length){if(c.visitor){if(c.pose==='walk')c.pose='stand'}else idleBehavior(c)}
  spawnParticles(c,dt);
}

const TOOLTXT={Read:'🔍 อ่านโค้ด',Grep:'🔍 ค้นหา',Glob:'🔍 ค้นไฟล์',Edit:'⌨ แก้ไฟล์',Write:'⌨ เขียนไฟล์',MultiEdit:'⌨ แก้ไฟล์',Bash:'⚙ รันคำสั่ง',WebSearch:'🌐 ค้นเว็บ',WebFetch:'🌐 อ่านเว็บ',TodoWrite:'📝 จดงาน',ask:'❓ ขอคำตอบ'};
const toolTxt=t=>TOOLTXT[t]||'⚙ '+t;
function activate(c,desc,meeting){
  interrupt(c);
  c.mode='working';c.last=nowS();c.task=desc||'';
  if(meeting)c.q=[{to:MEET_PLAN,pose:'meet',ms:Infinity,bubble:desc||'วางแผน'}];
  else c.q=[{to:seatT(c),carry:null},{pose:'work',ms:3200,bubble:desc||'รับงาน'}];
}
function activateWrite(c,desc){
  interrupt(c);
  c.mode='working';c.last=nowS();c.task=desc||'';
  c.q=[{to:WB_WRITE,pose:'write',ms:Infinity,bubble:desc||'จดไวท์บอร์ด'}];
}
function commitBoard(){boardShown=boardData;wbDirty=false;wbQueuedAt=0;wbWait=0}
function wbTick(){
  const n=nowS();
  if(wbQueuedAt&&n-wbQueuedAt>20)wbQueuedAt=0;
  if(!wbDirty){wbWait=0;return}
  if(wbQueuedAt)return;
  if(!wbWait)wbWait=n;
  if(n-wbWait>30){commitBoard();return}
  const s=byName.somchai;
  if(!s){commitBoard();return}
  if(s.mode==='working'||s.holdAsk||s.cheer>n)return;
  if(s.rest)interrupt(s);
  else if((s.cur&&s.cur.ms===Infinity)||s.q.some(q=>q.ms===Infinity))return;
  wbQueuedAt=n;
  s.q.push({to:WB_PASTE,carry:'paper',bubble:'📄 เอาโน้ตไปแปะ'},{pose:'stand',ms:1500,bubble:'📌 แปะไวท์บอร์ด',carry:'paper'},{fn:c=>{c.carry=null;commitBoard()}});
}
function onDelegate(ag,desc){

  turnDelegated=true;
  if(!x||x===f){f.q.push({pose:'stand',ms:700,bubble:desc||'ทำเอง'});return}

}

/* ============ E9b: คำขออนุมัติ (consult) ============ */
const consults=new Map(),visitors=new Map(),openCons=new Set();
const DOORX=-16,DOOR=T(DOORX,LANE);
const CRES={approve:'✅ อนุมัติแล้ว',revise:'✏ ให้แก้ไข',reject:'⛔ ไม่อนุมัติ'};
const consultsOf=(from,pend)=>[...consults.values()].filter(k=>k.from===from&&(!pend||k.status==='pending'));
const apprOf=k=>k.approver||'executive';
const pendCount=room=>{let n=0;consults.forEach(k=>{if(k.status==='pending'&&(!room||apprOf(k)===room))n++});return n};
const resTxt=k=>k.kind==='advise'?'💬 ได้รับคำแนะนำ':(CRES[k.decision]||'✅ ตัดสินแล้ว');
const visitorsIn=()=>bound?[...visitors.values()].filter(v=>v.room===bound.id):[];
const actors=()=>isExec()?chars.concat(visitorsIn()):chars;
/* หัวหน้าห้องต้นทาง: ถือเอกสารเดินไปประตูแล้วหายไป (away) */
function sendLeader(st,animate,txt){
  const f=st.chars[0];if(!f||f.away||f.leaving)return;
  interrupt(f);f.holdAsk=false;
  if(!animate){f.away=true;f.carry=null;return}
  f.leaving=true;
  f.q=[{to:DOOR,carry:'paper',bubble:txt||'📁 ไปขออนุมัติ',ms:2500},
       {fn:c=>{c.leaving=false;c.carry=null;c.away=true;leaderBack(st,true,null)}}];
}
/* กลับเข้าห้องเมื่อไม่มี consult ค้างของแผนกนี้ */
function leaderBack(st,animate,trig){
  const f=st.chars[0];if(!f||consultsOf(st.id,true).length)return;
  const txt=trig?resTxt(trig):(f.backTxt||null);
  if(f.leaving){if(trig)f.backTxt=txt;return}   // ยังเดินออกอยู่ : ให้ขั้นตอนท้ายเรียกกลับเอง
  f.backTxt=null;
  if(!f.away){if(trig)setBub(f,txt,3500);return}
  f.away=false;interrupt(f);f.carry=null;
  if(animate){f.x=DOORX;f.y=LANE;f.pose='walk';f.q=[{to:seatT(f),carry:null,bubble:txt,ms:3500}]}
  else{f.x=f.slot.seat.x;f.y=f.slot.seat.y;f.pose='sit';if(txt)setBub(f,txt,3500)}
}
/* มี event งานของห้องนี้ขณะหัวหน้า away → กลับเข้าห้องทันที */
function recallLeader(){
  if(isExec())return;   // ผู้บริหารที่ไปให้คำแนะนำ: กลับเมื่อ consult ตัดสินเท่านั้น
  const f=chars[0];if(!f||!(f.away||f.leaving))return;
  f.away=false;f.leaving=false;f.backTxt=null;interrupt(f);f.carry=null;
  f.x=f.slot.seat.x;f.y=f.slot.seat.y;f.pose='sit';
}
/* ผู้มาเยือนในห้อง executive */
function visitorSlot(room){
  const u=new Set();visitors.forEach(v=>{if(!v.exiting&&v.room===room)u.add(v.slotN)});
  for(let i=0;i<3;i++)if(!u.has(i))return i;
  return -1;
}
function dropVisitor(v){
  if(v.bubEl)v.bubEl.remove();if(v.tagEl)v.tagEl.remove();
  if(visitors.get(v.cid)===v)visitors.delete(v.cid);
}
function addVisitor(se,k,animate,n){
  inDept(se,()=>{
    const lf=(STATE.get(k.from)||{}).chars;const style=(lf&&lf[0]&&lf[0].style)||PRESETS[10];
    const label=String(k.fromName||k.from||'?');
    const stand=EXEC_STAND(n),sp=stand.inn[0];
    const v={visitor:true,room:se.id,cid:k.id,name:label,label,slotN:n,style,x:animate?DOORX:sp.x,y:animate?LANE:sp.y,t:Math.random()*5,seed:Math.random()*10,
      pose:animate?'walk':'stand',path:[],q:[],cur:null,wait:0,mode:'idle',last:nowS(),task:'',carry:'paper',bub:null,tool:null,rest:null,cheer:0,pt:0,
      slot:{seat:{x:-99,y:-99},out:[],inn:[],lx:0,deskTop:-99,deskX:-99,deskW:0},exiting:false};
    const bt=(k.kind==='advise'?'💬 ':'📁 ')+String(k.title==null?'':k.title).slice(0,22);
    const b=document.createElement('div');b.className='bub';ov.appendChild(b);v.bubEl=b;
    const tg=document.createElement('div');tg.className='tag';{const tb=document.createElement('b');tb.textContent=label.toUpperCase();tg.appendChild(tb)}
    ov.appendChild(tg);v.tagEl=tg;
    if(animate)v.q=[{to:stand,carry:'paper'},{pose:'stand',ms:Infinity,bubble:bt,carry:'paper'}];
    else setBub(v,bt);
    visitors.set(k.id,v);
  });
}
function removeVisitor(v,k,animate){
  v.exiting=true;
  if(!animate){dropVisitor(v);return}
  interrupt(v);v.carry=null;
  v.q=[{to:DOOR,bubble:(k&&k.status!=='pending'&&resTxt(k))||'👋',ms:2200},{fn:c=>dropVisitor(c)}];
}
function reconcileVisitors(animate){
  [...visitors.values()].forEach(v=>{
    const k=consults.get(v.cid),se=STATE.get(v.room);
    if(!se){dropVisitor(v);return}
    if(!v.exiting&&(!k||k.status!=='pending'))inDept(se,()=>removeVisitor(v,k,animate));
  });
  [...consults.values()].filter(k=>k.status==='pending'&&!visitors.has(k.id)).sort((a,b)=>a.t-b.t).forEach(k=>{
    const se=STATE.get(apprOf(k));if(!se||se.kind!=='exec')return;
    const n=visitorSlot(se.id);if(n>=0)addVisitor(se,k,animate,n);
  });
}
function consultEvent(k){
  if(!k||k.id==null)return;
  const prev=consults.get(k.id);consults.set(k.id,k);
  if(cur)inDept(cur,renderInbox);
  if(prev&&prev.status===k.status)return;   // event ซ้ำ (ส่งทั้ง dept ต้นทางและ executive)
  try{
    reconcileVisitors(true);
    const st=STATE.get(k.from);
    if(st)inDept(st,()=>{if(k.status==='pending')sendLeader(st,true,k.kind==='advise'?'💬 ไปให้คำแนะนำ':null);else leaderBack(st,true,prev?k:null)});
  }catch(e){console.error(e)}
}
function initConsults(list){
  visitors.forEach(v=>dropVisitor(v));visitors.clear();
  consults.clear();(Array.isArray(list)?list:[]).forEach(k=>{if(k&&k.id!=null)consults.set(k.id,k)});
  STATE.forEach(st=>{
    inDept(st,()=>{
      const f=chars[0];if(!f)return;
      if(f.away||f.leaving){interrupt(f);f.x=f.slot.seat.x;f.y=f.slot.seat.y;f.pose='sit';f.carry=null}
      f.away=false;f.leaving=false;f.backTxt=null;
      if(consultsOf(st.id,true).length)sendLeader(st,false);
    });
  });
  reconcileVisitors(false);
}

/* ============ วาดตัวละคร ============ */
function lighten(h,a){const n=parseInt(h.slice(1),16);const r=Math.min(255,(n>>16)+a),gg=Math.min(255,((n>>8)&255)+a),b=Math.min(255,(n&255)+a);return'#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1)}
const SITLIKE=['sit','work','review','think','rest'];
function drawChar(c){
  const S=c.style,t=c.t,n=nowS();
  const walking=c.pose==='walk';
  const stepA=Math.floor(t*8)%2===0;
  const bob=walking&&stepA?1:0;
  const x=Math.round(c.x),y=Math.round(c.y)-bob;
  const f=(a,b,w,h,col)=>px(x+a,y+b,w,h,col);
  const PANTS='#3a3a4a';
  if(!SITLIKE.includes(c.pose))f(3,CH-1+bob,10,2,'#0000003a');
  /* ผมด้านหลัง */
  if(S.style==='long'){f(1,3,14,10,O);f(2,4,12,8,S.hair)}
  if(S.style==='ponytail'){f(13,3,5,10,O);f(14,4,3,8,S.hair);f(13,5,2,2,'#ffd84d')}
  if(S.style==='bun'){f(0,0,5,5,O);f(1,1,3,3,S.hair)}
  /* แขน */
  const cheer=c.pose==='cheer';
  const sw=walking?(stepA?1:-1):0;
  const arm=(ax,dy)=>{f(ax,12+dy,4,4,O);f(ax+1,12+dy,2,2,S.jacket);f(ax+1,14+dy,2,1,S.skin)};

  if(c.rest)return c.rest.pose==='coffee'?'☕ พักดื่มกาแฟ':c.rest.pose==='chill'?'🗨 พักคุยเล่น':'💤 พักอยู่';
  if(c.pose==='meet')return c.holdAsk?'❓ รอคุณตัดสินใจ':'🗣 ประชุม';
  if(c.pose==='write')return'📝 เขียนไวท์บอร์ด';
  if(c.pose==='review')return'🔍 ตรวจงาน';
  if(c.pose==='think')return'💭 กำลังคิด';
  if(c.pose==='cheer')return'🎉 งานเสร็จ';

  const snaps=ev.depts&&typeof ev.depts==='object'?ev.depts:{prototype:ev};

  toasts.forEach(t=>t.remove());toasts.clear();
  deps.forEach(d=>{

    st.name=String(d.name||id);st.empty=!!d.empty;
    st.kind=d.kind==='exec'||(d.kind==null&&id==='executive')?'exec':'team';st.approver=d.approver||null;st.theme=id==='executive'?'gold':'silver';
    const sn=snaps[id]||{};
    inDept(st,()=>{
      buildRoster(Array.isArray(sn.roster)?sn.roster:[]);
      st.chat=Array.isArray(sn.chat)?sn.chat.slice():[];
      asks.clear();(Array.isArray(sn.asks)?sn.asks:[]).forEach(a=>{asks.set(a.id,a);if(a.status==='pending')toast(a,st)});

  let want=cur&&STATE.has(cur.id)?cur.id:lsGet();

    case'whiteboard':
      renderBoard(ev.board);boardData=ev.board;
      if(ev.changed){wbDirty=true;if(curTab!=='board'||st!==cur)setBoardNew(true)}else if(!wbQueuedAt&&!wbDirty)boardShown=ev.board;
      break;
    case'chat':addMsg(ev.msg);break;
    case'status':
      setRunning(ev.running);
      if(!ev.running)chars.forEach(c=>{if(!c.mgr&&c.mode==='working'){c.mode='idle';c.task='';c.last=nowS();interrupt(c)}});
      break;
    case'delegate':onDelegate(ev.agent,ev.desc);break;
    case'working':onWorking(ev.agent,ev.tool);break;
    case'done':onDone(ev.agent);break;
    case'fable_tool':onFableTool(ev.tool);break;
    case'ask':
      asks.set(ev.ask.id,ev.ask);toast(ev.ask,st);renderInbox();beep();desktopNotify(ev.ask,st);gatherForAsk();break;
    case'ask_update':{
      asks.set(ev.ask.id,ev.ask);
      const t=toasts.get(ev.ask.id);if(t){t.remove();toasts.delete(ev.ask.id)}
      renderInbox();
      if(!pending.size)releaseAsk();
      if(curAsk===ev.ask.id&&!$('#modal').hidden)openAsk(ev.ask.id);
      break}
    case'result':
      if(ev.ok&&turnDelegated)cheerAll();
      turnDelegated=false;break;
  }
}
window.__office={onEv,step,consults,visitors,get chars(){return chars},get fable(){return fable},STATE,switchTo,get cur(){return cur}};
if(typeof EventSource!=='undefined'){
  const es=new EventSource('/events?t='+TOKEN);
  es.onmessage=e=>{try{onEv(JSON.parse(e.data))}catch(err){console.error(err)}};
  es.onerror=()=>{$('#led').className='led off';$('#runtxt').textContent='ขาดการเชื่อมต่อ'};
  es.onopen=()=>{setRunning(running)};
}
requestAnimationFrame(frame);
})();
